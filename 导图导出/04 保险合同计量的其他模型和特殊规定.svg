<text x="22" y="980.0" font-size="23" font-weight="600">保险合</text>
<text x="22" y="1006.0" font-size="23" font-weight="600">同计量</text>
<text x="22" y="1032.0" font-size="23" font-weight="600">的其他</text>
<text x="22" y="1058.0" font-size="23" font-weight="600">模型和</text>
<text x="22" y="1084.0" font-size="23" font-weight="600">特殊规</text>
<text x="22" y="1110.0" font-size="23" font-weight="600">定</text>
<text x="146" y="426.0" font-size="18" font-weight="600">第一节　保费分配法</text>
<text x="350" y="161.5" font-size="15" font-weight="600">一、保费分配法的适用条件</text>
<rect x="570" y="113.03999999999999" width="161.8" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="572" y="122.0" font-size="14" font-weight="400">与 GMM 结果无重大差异</text>
<rect x="570" y="139.04" width="201" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="572" y="148.0" font-size="14" font-weight="400">各项合同责任期通常不超过一年</text>
<text x="572" y="174.0" font-size="14" font-weight="400">主要简化未到期责任负债计量</text>
<text x="572" y="200.0" font-size="14" font-weight="400">已发生赔款负债仍按相关要求计量</text>
<text x="350" y="284.5" font-size="15" font-weight="600">二、保费分配法的特点</text>
<text x="542" y="232.0" font-size="14" font-weight="400">不显性分解未来现金流、RA、CSM</text>
<text x="542" y="258.0" font-size="14" font-weight="400">服务收入通常按时间分摊</text>
<text x="542" y="284.0" font-size="14" font-weight="400">风险释放明显不均匀时调整分摊基础</text>
<text x="542" y="310.0" font-size="14" font-weight="400">有融资成分时考虑计息</text>
<text x="542" y="336.0" font-size="14" font-weight="400">获取现金流量可依条件选择费用化</text>
<text x="350" y="407.0" font-size="15" font-weight="600">三、保费分配法下的未到期责</text>
<text x="350" y="425.0" font-size="15" font-weight="600">任负债计量和合同损益</text>
<text x="587" y="368.0" font-size="14" font-weight="400">递延处理：纳入未到期责任负债相关计量，随服务摊销。</text>
<text x="587" y="394.0" font-size="14" font-weight="400">直接费用化：符合短期合同等规定条件时可选择。</text>
<rect x="585" y="411.04" width="159" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="587" y="420.0" font-size="14" font-weight="400">先辨处理模式，再套公式</text>
<text x="587" y="446.0" font-size="14" font-weight="400">初始与后续计量图表：精确公式见第192—193页，不能用同一公式混</text>
<text x="587" y="463.0" font-size="14" font-weight="400">套两种模式。</text>
<text x="350" y="547.5" font-size="15" font-weight="600">四、亏损合同</text>
<text x="482" y="495.0" font-size="14" font-weight="400">无反面事实时可假设初始非亏损</text>
<text x="482" y="521.0" font-size="14" font-weight="400">有迹象时重新评估履约现金流量</text>
<rect x="480" y="538.04" width="221.72000000000003" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="482" y="547.0" font-size="14" font-weight="400">履约现金流超过账面 LRC → 亏损</text>
<text x="482" y="573.0" font-size="14" font-weight="400">确认服务费用并增加 LRC</text>
<text x="482" y="599.0" font-size="14" font-weight="400">折现处理注意一致性</text>
<text x="350" y="679.0" font-size="15" font-weight="600">五、会计处理</text>
<text x="482" y="631.0" font-size="14" font-weight="400">收取保费与获取费用</text>
<text x="482" y="657.0" font-size="14" font-weight="400">提供保险服务并分摊保费</text>
<text x="482" y="683.0" font-size="14" font-weight="400">发生赔款并确认赔款负债</text>
<text x="482" y="709.0" font-size="14" font-weight="400">案例：5500－4200＝1300：第200页亏损金额计入服务费用与未到</text>
<text x="482" y="726.0" font-size="14" font-weight="400">期责任负债亏损部分。</text>
<text x="146" y="1133.5" font-size="18" font-weight="600">第二节　浮动收费法</text>
<text x="350" y="833.0" font-size="15" font-weight="600">一、浮动收费法的适用条件</text>
<rect x="570" y="763.04" width="173" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="572" y="772.0" font-size="14" font-weight="400">分享清晰可辨认的基础项目</text>
<rect x="570" y="789.04" width="271" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="572" y="798.0" font-size="14" font-weight="400">将基础项目公允价值回报大部分付给持有人</text>
<rect x="570" y="815.04" width="243" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="572" y="824.0" font-size="14" font-weight="400">应付金额变动相当部分随基础项目变动</text>
<text x="572" y="850.0" font-size="14" font-weight="400">在合同开始日评估</text>
<text x="572" y="876.0" font-size="14" font-weight="400">课件中的实务量化举例：70%和相关系数0.7为课件实务讨论口径，不</text>
<text x="572" y="893.0" font-size="14" font-weight="400">能替代准则定性条件。</text>
<text x="350" y="1081.0" font-size="15" font-weight="600">二、浮动收费法下保险合同负</text>
<text x="350" y="1099.0" font-size="15" font-weight="600">债的计量</text>
<text x="587" y="964.0" font-size="14" font-weight="400">浮动收费与计量组成</text>
<rect x="753" y="916.04" width="171.88" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="755" y="925.0" font-size="14" font-weight="400">负债＝履约现金流量＋CSM</text>
<text x="755" y="951.0" font-size="14" font-weight="400">初始计量与 GMM 相同</text>
<text x="755" y="977.0" font-size="14" font-weight="400">浮动收费：企业提供管理服务的对价</text>
<text x="755" y="1003.0" font-size="14" font-weight="400">区分随基础项目与不随其变动的现金流</text>
<text x="587" y="1089.5" font-size="14" font-weight="400">CSM 的后续变动</text>
<text x="734.84" y="1029.0" font-size="14" font-weight="400">新增合同的影响</text>
<text x="734.84" y="1055.0" font-size="14" font-weight="400">企业享有基础项目份额的变动</text>
<text x="734.84" y="1081.0" font-size="14" font-weight="400">未来服务相关履约现金流量变动</text>
<text x="734.84" y="1107.0" font-size="14" font-weight="400">汇兑差额与当期摊销</text>
<text x="734.84" y="1133.0" font-size="14" font-weight="400">风险缓释例外：满足规定条件时，有关金融风险影响可计入财务费用</text>
<text x="734.84" y="1150.0" font-size="14" font-weight="400">，避免与缓释工具错配。</text>
<text x="587" y="1215.0" font-size="14" font-weight="400">与 GMM 比较</text>
<text x="715.8" y="1176.0" font-size="14" font-weight="400">都以履约现金流量和 CSM 为基础</text>
<rect x="713.8" y="1193.04" width="188.68" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="715.8" y="1202.0" font-size="14" font-weight="400">VFA 部分金融变动影响 CSM</text>
<text x="715.8" y="1228.0" font-size="14" font-weight="400">GMM 通常将相关金融变动计入财务损益</text>
<text x="715.8" y="1254.0" font-size="14" font-weight="400">是否直接参与分红决定适用模型</text>
<text x="350" y="1316.5" font-size="15" font-weight="600">三、具有直接参与分红特征的</text>
<text x="350" y="1334.5" font-size="15" font-weight="600">保险合同损益</text>
<text x="587" y="1286.0" font-size="14" font-weight="400">服务收入－服务费用＝服务业绩</text>
<text x="587" y="1312.0" font-size="14" font-weight="400">服务收入、费用均剔除投资成分</text>
<text x="587" y="1338.0" font-size="14" font-weight="400">关注基础项目与负债金融变动的对应</text>
<text x="587" y="1364.0" font-size="14" font-weight="400">损益与 OCI 处理联系所持基础项目</text>
<text x="350" y="1444.0" font-size="15" font-weight="600">四、会计处理</text>
<text x="482" y="1396.0" font-size="14" font-weight="400">100份、3年期合同案例</text>
<text x="482" y="1422.0" font-size="14" font-weight="400">账户价值、最低给付与管理费</text>
<text x="482" y="1448.0" font-size="14" font-weight="400">比较基础项目收益和负债变化</text>
<text x="482" y="1474.0" font-size="14" font-weight="400">具体计算及分录回查原课件：第210—218页含大量图片表格，保留原</text>
<text x="482" y="1491.0" font-size="14" font-weight="400">页查看。</text>
<text x="146" y="1729.0" font-size="18" font-weight="600">第三节　具有相机参</text>
<text x="146" y="1750.0" font-size="18" font-weight="600">与分红特征的投资合</text>
<text x="146" y="1771.0" font-size="18" font-weight="600">同</text>
<text x="350" y="1619.5" font-size="15" font-weight="600">一、具有相机参与分红特征的</text>
<text x="350" y="1637.5" font-size="15" font-weight="600">投资合同的定义</text>
<text x="587" y="1589.0" font-size="14" font-weight="400">合同的定义</text>
<text x="699" y="1537.0" font-size="14" font-weight="400">保证金额＋附加金额</text>
<text x="699" y="1563.0" font-size="14" font-weight="400">附加金额是利益的重要组成</text>
<text x="699" y="1589.0" font-size="14" font-weight="400">时间和金额由企业相机决定</text>
<text x="699" y="1615.0" font-size="14" font-weight="400">附加金额基于基础项目回报</text>
<rect x="697" y="1632.04" width="145" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="699" y="1641.0" font-size="14" font-weight="400">没有转移重大保险风险</text>
<text x="587" y="1693.0" font-size="14" font-weight="400">适用准则取决于签发企业</text>
<rect x="781" y="1658.04" width="159" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="783" y="1667.0" font-size="14" font-weight="400">同时签发保险合同的企业：该类投资合同适用新保险合同准则。</text>
<text x="783" y="1693.0" font-size="14" font-weight="400">不签发保险合同的企业：适用金融工具相关准则。</text>
<text x="783" y="1719.0" font-size="14" font-weight="400">经济原因：与保险合同共享基础项目，条款具有相似性。</text>
<text x="350" y="1846.5" font-size="15" font-weight="600">二、具有相机参与分红特征的</text>
<text x="350" y="1864.5" font-size="15" font-weight="600">投资合同的计量</text>
<text x="587" y="1803.0" font-size="14" font-weight="400">模型选择与特殊规定</text>
<text x="755" y="1751.0" font-size="14" font-weight="400">符合直接参与分红条件 → VFA</text>
<text x="755" y="1777.0" font-size="14" font-weight="400">不符合条件 → GMM</text>
<rect x="753" y="1794.04" width="159" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="755" y="1803.0" font-size="14" font-weight="400">成为合同一方时初始确认</text>
<text x="755" y="1829.0" font-size="14" font-weight="400">合同边界看支付现金的实质性义务</text>
<text x="755" y="1855.0" font-size="14" font-weight="400">CSM 按提供投资服务的模式摊销</text>
<text x="587" y="1920.0" font-size="14" font-weight="400">相机决策权的影响</text>
<text x="741" y="1881.0" font-size="14" font-weight="400">分开金融假设变更与相机决策变更</text>
<rect x="739" y="1898.04" width="201" height="11.9" fill="#ead05c" opacity=".65"/>
