<text x="22" y="1100.0" font-size="23" font-weight="600">保险公</text>
<text x="22" y="1126.0" font-size="23" font-weight="600">司行政</text>
<text x="22" y="1152.0" font-size="23" font-weight="600">会计</text>
<text x="146" y="428.5" font-size="18" font-weight="600">第一节　保险公司的</text>
<text x="146" y="449.5" font-size="18" font-weight="600">支出与费用</text>
<text x="350" y="187.5" font-size="15" font-weight="600">支出、费用与成本的概念差异</text>
<text x="587" y="122.0" font-size="14" font-weight="400">支出：资源流出</text>
<text x="587" y="148.0" font-size="14" font-weight="400">费用：与本期收入匹配的耗费</text>
<text x="587" y="174.0" font-size="14" font-weight="400">成本：按对象归集的耗费</text>
<rect x="585" y="191.04" width="131" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="587" y="200.0" font-size="14" font-weight="400">支出不等于当期费用</text>
<text x="587" y="226.0" font-size="14" font-weight="400">偿付性支出：偿债目的资源流出，不直接影响经营损益。</text>
<text x="587" y="252.0" font-size="14" font-weight="400">资本性与收益性支出：按受益期间及确认要求判断。</text>
<text x="350" y="310.5" font-size="15" font-weight="600">专属费用和共同费用</text>
<text x="527" y="284.0" font-size="14" font-weight="400">专属费用：可直接追溯受益对象</text>
<text x="527" y="310.0" font-size="14" font-weight="400">共同费用：需要归集后分摊</text>
<rect x="525" y="327.04" width="173" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="527" y="336.0" font-size="14" font-weight="400">直接归属与合理分摊相结合</text>
<text x="350" y="407.5" font-size="15" font-weight="600">按性质分类的支出</text>
<text x="512" y="368.0" font-size="14" font-weight="400">保险赔付支出：赔款、满期给付、死伤医疗给付、年金和退保等。</text>
<text x="512" y="394.0" font-size="14" font-weight="400">手续费及佣金支出</text>
<text x="512" y="420.0" font-size="14" font-weight="400">业务及管理费用</text>
<text x="512" y="446.0" font-size="14" font-weight="400">按性质记录有助于日常核算</text>
<text x="350" y="539.0" font-size="15" font-weight="600">按功能分类的支出</text>
<text x="512" y="478.0" font-size="14" font-weight="400">赔付中的保险成分 → 服务费用</text>
<rect x="510" y="495.04" width="213.88" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="512" y="504.0" font-size="14" font-weight="400">赔付中的投资成分 → 偿付性支出</text>
<text x="512" y="530.0" font-size="14" font-weight="400">直接归属保险组合的获取现金流量</text>
<text x="512" y="556.0" font-size="14" font-weight="400">直接归属保险组合的维持费用</text>
<text x="512" y="582.0" font-size="14" font-weight="400">不直接归属保险组合的费用：含非保险保单费用及不能直接归属的保</text>
<text x="512" y="599.0" font-size="14" font-weight="400">险相关费用。</text>
<text x="350" y="683.0" font-size="15" font-weight="600">新旧准则下支出分类的差异及</text>
<text x="350" y="701.0" font-size="15" font-weight="600">支出与费用的关系</text>
<text x="587" y="631.0" font-size="14" font-weight="400">会计期末分类并分摊</text>
<text x="587" y="657.0" font-size="14" font-weight="400">获取现金流量一般具有资本性性质</text>
<text x="587" y="683.0" font-size="14" font-weight="400">确认前 → 获取现金流量资产</text>
<text x="587" y="709.0" font-size="14" font-weight="400">确认后 → 保险合同相关计量</text>
<rect x="585" y="726.04" width="187" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="587" y="735.0" font-size="14" font-weight="400">利润表费用含摊销和估计变动：不能直接以当期现金支出代替保险服</text>
<text x="587" y="752.0" font-size="14" font-weight="400">务费用。</text>
<text x="146" y="1132.0" font-size="18" font-weight="600">第二节　保险公司支</text>
<text x="146" y="1153.0" font-size="18" font-weight="600">出和费用的会计处理</text>
<text x="350" y="815.5" font-size="15" font-weight="600">保险公司支出与费用核算的新</text>
<text x="350" y="833.5" font-size="15" font-weight="600">旧差异</text>
<text x="587" y="798.0" font-size="14" font-weight="400">旧：按性质计入损益，再调准备金</text>
<text x="587" y="824.0" font-size="14" font-weight="400">新：按性质记录后分类和分摊</text>
<rect x="585" y="841.04" width="215" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="587" y="850.0" font-size="14" font-weight="400">偿付性、资本性与收益性支出分开</text>
<text x="350" y="930.0" font-size="15" font-weight="600">会计科目的设置</text>
<text x="497" y="882.0" font-size="14" font-weight="400">手续费及佣金支出</text>
<text x="497" y="908.0" font-size="14" font-weight="400">业务及管理费支出</text>
<rect x="495" y="925.04" width="89" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="497" y="934.0" font-size="14" font-weight="400">费用分摊结转：连接按性质归集和按功能确认的过渡／备抵科目。</text>
<text x="497" y="960.0" font-size="14" font-weight="400">期末科目余额与利润表对应：具体余额方向及抵销展示回查第283页</text>
<text x="497" y="977.0" font-size="14" font-weight="400">。</text>
<text x="350" y="1182.5" font-size="15" font-weight="600">保险公司支出与费用的会计核</text>
<text x="350" y="1200.5" font-size="15" font-weight="600">算</text>
<text x="587" y="1048.0" font-size="14" font-weight="400">保险赔付的三步处理</text>
<text x="755" y="1009.0" font-size="14" font-weight="400">运营审核确认赔付</text>
<text x="755" y="1035.0" font-size="14" font-weight="400">精算识别保险与投资成分</text>
<text x="755" y="1061.0" font-size="14" font-weight="400">财务按成分分类确认</text>
<rect x="753" y="1078.04" width="215" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="755" y="1087.0" font-size="14" font-weight="400">保险成分与投资成分报表去向不同</text>
<text x="587" y="1178.0" font-size="14" font-weight="400">手续费及佣金</text>
<text x="713" y="1113.0" font-size="14" font-weight="400">先区分保险与非保险合同</text>
<text x="713" y="1139.0" font-size="14" font-weight="400">保险合同部分指定或分摊为获取费用</text>
<text x="713" y="1165.0" font-size="14" font-weight="400">组未确认 → 获取现金流量资产</text>
<text x="713" y="1191.0" font-size="14" font-weight="400">组已确认 → 未到期责任负债相关明细</text>
<text x="713" y="1217.0" font-size="14" font-weight="400">PAA 可按条件选择费用化</text>
<text x="713" y="1243.0" font-size="14" font-weight="400">非履约现金流 → 其他相关费用</text>
<text x="587" y="1321.0" font-size="14" font-weight="400">业务及管理费用</text>
<text x="727" y="1269.0" font-size="14" font-weight="400">分为获取费用与维持费用</text>
<text x="727" y="1295.0" font-size="14" font-weight="400">不能归属的部分保留其他费用</text>
<text x="727" y="1321.0" font-size="14" font-weight="400">获取费用按组是否确认分别处理</text>
<text x="727" y="1347.0" font-size="14" font-weight="400">维持费用确认为有关服务费用</text>
<rect x="725" y="1364.04" width="201" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="727" y="1373.0" font-size="14" font-weight="400">使用费用分摊结转连接前后分类</text>
<text x="350" y="1435.5" font-size="15" font-weight="600">会计处理示例与费用分摊对财</text>
<text x="350" y="1453.5" font-size="15" font-weight="600">务报表的影响</text>
<text x="587" y="1405.0" font-size="14" font-weight="400">按性质的支出合计可追踪</text>
<text x="587" y="1431.0" font-size="14" font-weight="400">按功能影响资产、负债与利润表</text>
<text x="587" y="1457.0" font-size="14" font-weight="400">GMM 与 VFA 费用列报处理相同</text>
<text x="587" y="1483.0" font-size="14" font-weight="400">完整分录和数据见第293—296页</text>
<text x="146" y="1816.5" font-size="18" font-weight="600">第三节　保险获取现</text>
<text x="146" y="1837.5" font-size="18" font-weight="600">金流量资产</text>
<text x="350" y="1568.5" font-size="15" font-weight="600">保险获取现金流量</text>
<text x="512" y="1529.0" font-size="14" font-weight="400">直接归属于保险合同组</text>
<text x="512" y="1555.0" font-size="14" font-weight="400">直接归属于保险合同组合</text>
<text x="512" y="1581.0" font-size="14" font-weight="400">需要合理分摊的获取费用</text>
<text x="512" y="1607.0" font-size="14" font-weight="400">销售、核保、承保活动产生</text>
<text x="350" y="1786.5" font-size="15" font-weight="600">保险获取现金流量的确认与会</text>
<text x="350" y="1804.5" font-size="15" font-weight="600">计处理</text>
<text x="587" y="1691.0" font-size="14" font-weight="400">确认前后不同处理</text>
<rect x="739" y="1630.04" width="227.88" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="741" y="1639.0" font-size="14" font-weight="400">组确认前 → 保险获取现金流量资产</text>
<rect x="739" y="1656.04" width="213.88" height="11.9" fill="#ead05c" opacity=".65"/>
<text x="741" y="1665.0" font-size="14" font-weight="400">组初始确认时 → 终止确认该资产</text>
<text x="741" y="1691.0" font-size="14" font-weight="400">将相关金额纳入保险合同计量</text>
<text x="741" y="1717.0" font-size="14" font-weight="400">组确认后在保险期间递延摊销</text>
<text x="741" y="1743.0" font-size="14" font-weight="400">不要把确认后的递延理解为仍单列该资产</text>
<text x="587" y="1808.0" font-size="14" font-weight="400">非 PAA 下的例子</text>
<text x="743.8" y="1769.0" font-size="14" font-weight="400">4年期合同与20万元获取现金流</text>
<text x="743.8" y="1795.0" font-size="14" font-weight="400">已发生获取现金流进入合同相关计量</text>
<text x="743.8" y="1821.0" font-size="14" font-weight="400">在各会计期间摊销</text>
<text x="743.8" y="1847.0" font-size="14" font-weight="400">具体分录见第301—303页</text>
<text x="587" y="1912.0" font-size="14" font-weight="400">PAA 的费用化选择</text>
<text x="748.84" y="1873.0" font-size="14" font-weight="400">责任期不超过一年等规定条件</text>
<text x="748.84" y="1899.0" font-size="14" font-weight="400">可选择直接计入当期费用</text>
<text x="748.84" y="1925.0" font-size="14" font-weight="400">选择费用化时不确认该资产</text>
<text x="748.84" y="1951.0" font-size="14" font-weight="400">其他情形确认前仍应递延</text>
<text x="350" y="2043.5" font-size="15" font-weight="600">保险获取现金流量资产的类型</text>
<text x="350" y="2061.5" font-size="15" font-weight="600">与确认方法</text>
